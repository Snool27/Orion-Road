<!doctype html><meta charset="utf-8"><iframe id="a" src="/index.html?b" style="width:390px;height:844px;border:0"></iframe>
<script>
const R=[]; const ok=(c,m)=>R.push((c?"PASS ":"FAIL ")+m); const wait=ms=>new Promise(r=>setTimeout(r,ms)); const errs=[];
const f=document.getElementById("a"); setInterval(()=>{ try{ const w=f.contentWindow; if(w&&!w.__h){ w.__h=1; w.addEventListener("error",e=>errs.push(e.message)); } }catch(e){} },1);
f.addEventListener("load",()=>setTimeout(async()=>{ try{ const w=f.contentWindow, d=w.document, E=x=>w.eval(x);
  const J=await (await fetch("/builds.json")).json();
  E('S.goal.l="gold"; S.modes={mp:true,dmz:false,wz:true}; S.open="mar-9"; S.tab="MR"; render();'); await wait(1200);
  let b=d.querySelector('.gun[data-gun="mar-9"] .builds');
  ok(!!b,"opened gun shows a Build box");
  ok(b&&b.querySelectorAll(".blist li").length===J.guns["mar-9"].mp.best.attachments.length,"shows the MP best attachments");
  ok(b&&!b.querySelector(".blinks")&&b.querySelectorAll("a").length<=1,"no link buttons, at most one small source link");
  ok(b&&[...b.querySelectorAll("[data-bsel^='m:']")].map(x=>x.textContent).join()==="MP,WZ","mode switch shows only modes you play");
  b.querySelector("[data-bsel='m:wz']").click(); await wait(200); b=d.querySelector('.gun[data-gun="mar-9"] .builds');
  ok(b.querySelector("[data-bsel='m:wz']").getAttribute("aria-pressed")==="true"&&b.querySelector(".blist li b").textContent===J.guns["mar-9"].wz.best.attachments[0].name,"tapping WZ shows the Warzone build");
  ok(!b.querySelector("[data-bsel='k:early']"),"no Early button when there is no early build");
  E('S.open="vel-46"; S.tab="SMG"; BSEL.m="mp"; render();'); await wait(200); b=d.querySelector('.gun[data-gun="vel-46"] .builds');
  const eb=b&&b.querySelector("[data-bsel='k:early']"); ok(!!eb,"Early button appears when an early build exists");
  if(eb){ eb.click(); await wait(200); b=d.querySelector('.gun[data-gun="vel-46"] .builds'); ok(b.querySelector(".blist li b").textContent===J.guns["vel-46"].mp.early.attachments[0].name&&/level 10/.test(b.textContent),"tapping Early shows the early build and its level"); }
  E('S.open="pila"; S.tab="LCH"; render();'); await wait(200); ok(!d.querySelector('.gun[data-gun="pila"] .builds'),"gun with no build shows no empty box");
  const n=E('WEAPONS.filter(x=>BUILDS.guns[x.id]).length'); ok(n>=25,"builds loaded for "+n+" guns");
 }catch(e){ R.push("ERROR "+e.stack.split("\n").slice(0,2).join(" ")); }
 R.push("page errors: "+(errs.length?errs.join(" | "):"none")); fetch("/result",{method:"POST",body:R.join("\n")}); },1500));
</script>
