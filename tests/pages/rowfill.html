<!doctype html><meta charset="utf-8"><iframe id="a" src="/index.html?b" style="width:390px;height:844px;border:0"></iframe>
<script>
const R=[]; const ok=(c,m)=>R.push((c?"PASS ":"FAIL ")+m); const wait=ms=>new Promise(r=>setTimeout(r,ms)); const errs=[];
const f=document.getElementById("a"); setInterval(()=>{ try{ const w=f.contentWindow; if(w&&!w.__h){ w.__h=1; w.addEventListener("error",e=>errs.push(e.message)); } }catch(e){} },1);
f.addEventListener("load",()=>setTimeout(async()=>{ try{ const w=f.contentWindow, d=w.document, E=x=>w.eval(x);
  E('S.goal.l="div"; S.modes={mp:true}; S.weapons={}; S.tab="AR"; S.open=null; render();'); await wait(1000);
  const card=()=>d.querySelector('.gun[data-gun="m4"]'), vis=el=>!!el&&el.offsetParent!==null;
  ok(vis(card().querySelector('[data-step="0"]'))&&vis(card().querySelector('[data-step="8"]')),"military and special boxes show on the closed row");
  ok(vis(card().querySelector('.qb.nx')),"Next ▸ shows on the closed row");
  card().querySelector('[data-step="2"]').click(); await wait(300);
  ok(E('W("m4").mil')===3&&E('S.open')!==("m4"),"tapping box 3 fills Military 1–3 without opening the gun");
  card().querySelector('.qb.nx').click(); await wait(300); ok(E('W("m4").mil')===4,"Next ▸ ticks Military 4 from the row");
  card().querySelector('.chip').click(); await wait(300); ok(E('S.open')==="m4","tapping the camo tile still opens the gun");
 }catch(e){ R.push("ERROR "+e.stack.split("\n").slice(0,2).join(" ")); }
 R.push("page errors: "+(errs.length?errs.join(" | "):"none")); fetch("/result",{method:"POST",body:R.join("\n")}); },1500));
</script>
