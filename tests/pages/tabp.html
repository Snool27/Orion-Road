<!doctype html><meta charset="utf-8"><iframe id="a" src="/index.html?b" style="width:390px;height:844px;border:0"></iframe>
<script>
const R=[]; const ok=(c,m)=>R.push((c?"PASS ":"FAIL ")+m); const wait=ms=>new Promise(r=>setTimeout(r,ms)); const errs=[];
const f=document.getElementById("a"); setInterval(()=>{ try{ const w=f.contentWindow; if(w&&!w.__h){ w.__h=1; w.addEventListener("error",e=>errs.push(e.message)); } }catch(e){} },1);
f.addEventListener("load",()=>setTimeout(async()=>{ try{ const w=f.contentWindow, d=w.document, E=x=>w.eval(x);
  const full='({mil:8,max:true,pr:0,sp:[true,true,true],gold:true,plat:true,hb:false,tok:false})';
  const gold='({mil:8,max:true,pr:0,sp:[true,true,true],gold:true,plat:false,hb:false,tok:false})';
  E(`S.goal.l="div"; S.modes={mp:true}; S.skip={}; S.weapons={}; WEAPONS.filter(w=>w.cls==="AR").forEach(w=>S.weapons[w.id]=${full}); S.weapons["axion"]=${gold}; S.tab="AR"; S.open=null; render();`); await wait(1200);
  const tabEl=()=>d.querySelector('#ctabs [data-c="AR"]');
  ok(/lv-plat/.test(tabEl().className)&&/cam-plat/.test(tabEl().className),"AR tab is Platinum: 7 launch ARs + Cronen Osprey at Platinum ("+tabEl().className+")");
  const pct=+tabEl().querySelector("small").textContent.replace("%","");
  ok(pct===Math.round(100*13/14) ,"AR percent counts the Season gun in place of the missing one ("+pct+"%)");
  E('S.skip={"cronen-osprey":true}; render();'); await wait(200);
  ok(!/lv-plat/.test(tabEl().className),"turning off 'Count this gun' takes it back out ("+tabEl().className+")");
  ok(/1 left/.test(tabEl().textContent),"tab then shows 1 left");
  E('S.skip={}; S.weapons["cronen-osprey"]='+gold+'; render();'); await wait(200);
  ok(!/lv-plat/.test(tabEl().className),"without the Season gun at Platinum the tab isn't Platinum");
  E('S.weapons["cronen-osprey"]='+full+'; checkMilestones(); render();'); await wait(300);
  ok(E('milestones()["p-AR"]')===true,"class-complete Platinum milestone fires");
  const smg=d.querySelector('#ctabs [data-c="SMG"]'); ok(!/lv-plat/.test(smg.className),"other tabs unaffected");
 }catch(e){ R.push("ERROR "+e.stack.split("\n").slice(0,2).join(" ")); }
 R.push("page errors: "+(errs.length?errs.join(" | "):"none")); fetch("/result",{method:"POST",body:R.join("\n")}); },1500));
</script>
