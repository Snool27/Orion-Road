<!doctype html><meta charset="utf-8"><iframe id="a" src="/index.html?b" style="width:390px;height:844px;border:0"></iframe>
<script>
const R=[]; const ok=(c,m)=>R.push((c?"PASS ":"FAIL ")+m); const wait=ms=>new Promise(r=>setTimeout(r,ms)); const errs=[];
const f=document.getElementById("a"); setInterval(()=>{ try{ const w=f.contentWindow; if(w&&!w.__h){ w.__h=1; w.addEventListener("error",e=>errs.push(e.message)); } }catch(e){} },1);
f.addEventListener("load",()=>setTimeout(async()=>{ try{ const w=f.contentWindow, d=w.document, E=x=>w.eval(x);
  const st=(g,p,h)=>`({mil:8,max:true,pr:0,sp:[true,true,true],gold:${g},plat:${p},hb:${h},tok:false})`;
  E(`S.goal.l="div"; S.modes={mp:true}; S.skip={}; S.weapons={}; WEAPONS.filter(w=>w.cls==="AR").forEach(w=>S.weapons[w.id]=${st(true,false,false)}); S.tab="AR"; S.open=null; render();`); await wait(1200);
  let n=d.querySelector("#clsH .nextup");
  ok(n&&/Platinum/.test(n.textContent)&&/50 headshots/.test(n.textContent),"all ARs Gold: card says Platinum · 50 headshots");
  ok(n&&/every gun/.test(n.textContent)&&n.querySelectorAll("[data-go]").length===9,"lists all 9 ARs as ready");
  n.querySelector('[data-go="m4"]').click(); await wait(400);
  ok(E('S.open')==="m4"&&d.querySelector('.gun.open[data-gun="m4"]'),"tapping a gun name opens that gun");
  ok(d.querySelector('.gun[data-gun="m4"] [data-act="plat"]')&&!d.querySelector('.gun[data-gun="m4"] [data-act="plat"]').disabled,"Platinum is unlocked on that gun");
  E(`S.weapons["axion"]=${st(false,false,false)}; S.weapons["axion"].sp=[true,true,false]; S.open=null; render();`); await wait(200);
  n=d.querySelector("#clsH .nextup"); ok(n&&/Platinum/.test(n.textContent)&&/8 guns/.test(n.textContent),"Season gun stands in for the unfinished Axion: still 8 guns ready for Platinum");
  E(`S.skip={"cronen-osprey":true}; render();`); await wait(200);
  n=d.querySelector("#clsH .nextup"); ok(!n||!/Platinum/.test(n.textContent),"without the Season gun the class isn't Gold yet, so no Platinum card");
  E(`S.skip={}; WEAPONS.filter(w=>!w.season).forEach(w=>S.weapons[w.id]=${st(true,true,false)}); S.tab="ALL"; S.filt=""; render();`); await wait(400);
  const gh=d.querySelector('.ghead[data-gun="h-SMG"] .gnext'); ok(gh&&/Harmonic Break/.test(gh.textContent),"All view header shows Next: Harmonic Break ("+(gh&&gh.textContent)+")");
  E(`S.weapons["csg-35"]=${st(true,false,false)}; S.tab="SMG"; render();`); await wait(300); n=d.querySelector("#clsH .nextup");
  ok(n&&/Harmonic Break/.test(n.textContent)&&/Also ready for Platinum/.test(n.textContent),"SMG card: HB for 5 Plat guns, plus CSG-35 ready for Platinum");
 }catch(e){ R.push("ERROR "+e.stack.split("\n").slice(0,2).join(" ")); }
 R.push("page errors: "+(errs.length?errs.join(" | "):"none")); fetch("/result",{method:"POST",body:R.join("\n")}); },1500));
</script>
