# Publishes the website files to GitHub Pages on every push to main.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Only the website itself goes public. Tests, notes, scripts and SQL stay in the repo only.
      - name: Collect the website files
        run: |
          mkdir _site
          cp -R index.html sw.js manifest.webmanifest builds.json og.png icon.svg icon-*.png css js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
